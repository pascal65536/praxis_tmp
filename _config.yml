remote_theme: just-the-docs/just-the-docs@v0.7.0
color_scheme: light
heading_anchors: true
permalink: pretty

plugins:
  - jekyll-remote-theme
  - jekyll-readme-index

exclude:
  - tasks/

title: "TMP"
description: "TMP is my life."
lang: ru

nav_enabled: true
search_enabled: true

collections:
  docs:
    permalink: "/:collection/:path/"
    output: true
  guides:
    permalink: "/:collection/:path/"
    output: true

just_the_docs:
  collections:
    docs:
      name: "Документация"
    guides:
      name: "Руководства"
      nav_fold: true